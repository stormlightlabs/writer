[package]
name = "commonplace-store"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
rusqlite = { version = "0.38", features = ["bundled", "chrono", "serde_json"] }
dirs = "6"
tempfile = "3.27"
log = "0.4"
blake3 = "1"
resvg = "0.44"
base64 = "0.22"

commonplace-core = { path = "../core" }
commonplace-md = { path = "../markdown" }
